name: Changelog - Compile changelogs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  compile:
    name: Compile changelogs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Checkout
        uses: actions/checkout@v6
          
      - name: Compile changelogs
        run: |
          python tools/ss13_genchangelog.py changelogs

      - name: Generate JSON
        run: |
          python tools/generate_changelog_json.py changelogs

      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit changes
        run: |
          git config --global user.name "${{ secrets.APP_PUBLIC_NAME }}[bot]"
          git config --global user.email "${{ secrets.APP_PUBLIC_ID }}+${{ secrets.APP_PUBLIC_NAME }}[bot]@users.noreply.github.com"
          git commit -m "Automatic changelog compile ($(date -d 'yesterday' +'%d.%m.%Y'))"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ steps.app-token-generation.outputs.token }}
          branch: changelog