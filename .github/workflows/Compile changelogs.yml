name: Changelog - Compile changelogs

on:
  push:
    branches:
      - changelog
  workflow_dispatch:

jobs:
  compile:
    name: Compile changelogs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.sender.login == 'horizon-dev-sync[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            Horizon-Changelog
            horizon-scripts

      - name: Download Compile Changelogs - horizon-scripts
        env:
          GH_TOKEN: ${{ steps.app-token-generation.outputs.token }}
        run: |
          gh api repos/horizon-dev-team/horizon-scripts/contents/Changelog/compile_changelogs.py --jq '.content' | base64 -d > changelogs/compile_changelogs.py

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Compile changelogs
        run: |
          python changelogs/compile_changelogs.py changelogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config --global user.name "${{ secrets.APP_NAME }}[bot]"
          git config --global user.email "${{ secrets.APP_ID }}+${{ secrets.APP_NAME }}[bot]@users.noreply.github.com"
          git add changelogs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automatic changelog compile ($(date +'%d.%m.%Y'))"
          git push origin changelog
        env:
          GITHUB_TOKEN: ${{ steps.app-token-generation.outputs.token }}