name: Changelog - Compile changelogs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  compile:
    name: Compile changelogs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile changelogs
        run: |
          python changelogs/compile_changelogs.py changelogs

      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit changes
        run: |
          git config --global user.name "${{ secrets.APP_PUBLIC_NAME }}[bot]"
          git config --global user.email "${{ secrets.APP_PUBLIC_ID }}+${{ secrets.APP_PUBLIC_NAME }}[bot]@users.noreply.github.com"
          git add changelogs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automatic changelog compile ($(date -d 'yesterday' +'%d.%m.%Y'))"
          git push origin changelog
        env:
          GITHUB_TOKEN: ${{ steps.app-token-generation.outputs.token }}