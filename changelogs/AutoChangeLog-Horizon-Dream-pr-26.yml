  95796:
    repo: "tgstation/tgstation"
    title: "Makes significant changes to Heretic spells and rituals"
    changes:
      MrMelbert:
        - balance: "Heretics no longer need a focus to cast spells."
        - balance: "(Almost) all heretic spells are now limited to a number of charges. Once you are out of charges, you need to replenish them. For some spells, there are special conditions to fulfill to recharge them, but for most of them you must simply complete a condition according to your path (like rusting tiles as rust)."
        - balance: "Holywater will purge spell charges from heretics."
        - balance: "\"Amber Focus\" is now a tier one side knowledge that slooowwwly replenishes spell charges over time."
        - balance: "Codex Cicatrix is now a T1 knowledge. Its drain speed has been increased (1.5x slower) as has its draw speed (1.875x slower). Codex Morbus has also seen an increase to drain speed (2x slower) and draw speed (2x slower)."
        - balance: "Warren King's Welcome is now a T1 knowedge and has additional effects - restricting nearby airlocks to \"heretic\" access and granting your ID \"heretic\" access."
        - balance: "Ash heretics can no longer empower their spells while on fire."
        - balance: "Wolves Among Sheep heretic healing has been reduced by 75% (60 -> 15)"
        - tweak: "Heretic rituals now use a radial for deciding which to invoke"
        - tweak: "Tooltips for heretics are now formatted, easier to read"
        - rscadd: "Adds a tier two knowledge to heretic, \"Unwrap Minds\", which allows them to hypnotize someone."
        - rscadd: "Adds a tier one knowledge to heretic, \"The Miraculous Mirror\", which allow them to change their appearance (including species)."
        - rscadd: "Adds a tier three knowledge to heretic, \"Keys to the Backdoor\", which effectively gives them a pocket dimension accessible via closet to do... things in."
        - rscadd: "Mask of Madness is now a tier three side knowledge, allowing any heretic access to it. Also now requires lit candles."
        - rscadd: "Ash Heretics now have a new main path node, \"Nightwatcher's Lantern\", which causes negative effects to mobs who are in the light's radius."
        - balance: "Shadow Cloak is no longer an innate heretic knowledge, but is guaranteed to show up for free in the first draft pool (in addition to the three other options)."
