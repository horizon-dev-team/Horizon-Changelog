    title: "[MDB Ignore] AI Law Rework 2: Electric Boogaloo: \"Not for broadcast\""
    changes:
      MrMelbert:
        - rscadd: "The AI and Cyborg upload computers have been replaced with module racks, a physical manifestation of AI laws."
        - rscadd: "To subvert an AI, you can print a \"broadcaster law rack\" to remotely link to the station's \"core law rack\". Modules in the portable law rack will be applied on top of the core law rack's laws. Don't worry, hacked laws are still applied with priority."
        - rscadd: "Upgrades for the AI, like combat upgrades, are now applied via a module rack instead of hitting the AI core."
        - rscadd: "Ion storms will now damage law modules housed in module racks, requiring manual maintenance (a multitool)."
        - rscdel: "You can no longer upload a AI laws directly to AI cores, active or mid construction. You can use a multitool to pre-link AIs to racks, otherwise they will automatically connect to the station's core rack (or nothing, if offstation)."
        - rscdel: "Removed \"law priority\" from freeform laws"
        - rscadd: "TGUI \"state laws\" window"
