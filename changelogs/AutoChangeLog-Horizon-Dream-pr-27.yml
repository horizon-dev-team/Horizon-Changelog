# PR: horizon-dev-team/Horizon-Dream/27
Horizon =][=:
  27:
    repo: "horizon-dev-team/Horizon-Dream"
    title: "ADD: Random Thrown Item Rotation"
    body: |
      ## Описание изменений
      Добавляет разные повороты к предметам, с разными направлениями. (Строго-заданными)
      - Брошенные или упавшие предметы поворачиваются на один из 4 фиксированных углов (0°, 90°, 180°, 270°)
      - Осколки разбитых бутылок и стекла игнорируют фиксированные углы и разлетаются под полностью случайным углом (0-360°)
      - Трубы и гильзы остаются без поворота (как исключение)
      
      Техническая часть:
      - Добавлен новый флаг: `NO_ROTATE_RANDOM_THROW`
      - Добавлены некоторым предметам, отключает случайные повороты предметов
      - Учтена логика бросков в руки/голову
      
      ## Причина создания ПР / Почему это хорошо для игры
      Визуальное разнообразие - предметы лежат более естественно. Осколки стекла разлетаются хаотично.
      Повороты предметов с Йогов, улучшена логика и исправлены их недоработки.
      - https://github.com/yogstation13/Yogstation/pull/12789
      - https://github.com/yogstation13/Yogstation/pull/21968
      
      ## Демонстрация изменений / Тестирование
