  35:
    repo: "horizon-dev-team/Horizon-Dream"
    title: "REFACTOR: Consistent Ghost Appearance System"
    body: |
      ## Описание изменений
      Меняет систему внешности призраков и заменяя её на внешность текущего персонажа.
      Удалена полностью старая система внешности призраков.
      - Основано на идеи: https://github.com/BeeStation/BeeStation-Hornet/pull/14362
      
      Принципы работы:
      - При смерти, вся внешность и все оверлеи на персонаже, которые были на мёртвом теле персонаж. 
        - Это включает внутренности, отсутствующие конечности, одежду и травмы конечностей, и огонь.
      - При входе за наблюдателя, они получают внешность своего персонажа из выбранного слота.
        - При этом не учитываются никакие предпочтения по ролям - персонаж будет отображаться в нижнем белье.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Технически новая система работает за счёт переноса масок и оверлеев персонажа на призрака, к которым применяются альфа-фильтры прозрачности и цветокоррекции. 
      
      > Визуально это выглядит гораздо чище и отлично вписывается в новую систему возрождения.
      > Поэкспериментировал с настройками, чтобы добиться правильного баланса, и, по-моему, результат вышел отличный.
      
      ## Демонстрация изменений / Тестирование
