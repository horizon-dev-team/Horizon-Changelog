# PR: horizon-dev-team/Horizon-Dream/4
delete-after: True
/TG/Station:
  95751:
    title: "fixes second-choice headrevs having their preferences ignored"
    changes:
      lelandkemble:
        - bugfix: "Roundstart revs will no longer choose people who do not want to be headrevs as headrevs"
