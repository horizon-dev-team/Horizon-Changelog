    title: "Fix admin shuttle recall revealing admin location"
    changes:
      timothymtorres:
        - bugfix: "Fix admin shuttle recall revealing admin location"
  95726:
    title: "Takes the donk-co cameras off of the main station network"
    changes:
      Rhials:
        - bugfix: "Donk Trading Post cameras no longer show up on the station cameranet"
  95698:
    title: "Restores keybindings to their original defaults, moves the new per-hand bind options to Unbound by default."
    changes:
      Iamgoofball:
        - tweak: "Restores keybindings to their original pre-August 2025 defaults, moves the new per-hand bind options to Unbound by default."
  95679:
    title: "Fix toiletbong"
    changes:
      lelandkemble:
        - bugfix: "toiletbong works"
  95673:
    title: "Remove the ability to handcuff shields"
    changes:
      Layzu666:
        - balance: "Now you can't handcuff shields"
  95580:
    title: "Partially moves the iconoclast's repeater behind a knowledge book"
    changes:
      TheRyeGuyWhoWillNowDie:
        - balance: "making the handheld iconoclast's repeater now requires learning its recipe, the book for which can spawn in maintenance."
  95599:
    title: "Liberator pistol applies damage multipliers in process_fire() rather than fire_gun()"
    changes:
      lelandkemble:
        - bugfix: "Liberator pistol applies point-blank damage modifier no matter how it is fired"
  95572:
    title: "heretic fixes + makes aura emissive"
    changes:
      Arturlang:
        - bugfix: "rust heretic robes now become buffed if the tile under you becomes rusted"
        - balance: "void ascension and the void chill status effect now respect antimagic"
        - rscadd: "heretic aura is now emissive."
        - bugfix: "a exploit where you could exit space phase anywhere by loosing your heretic focus"
        - bugfix: "moon ascension aura not affecting anyone else if one of the targets has more than 10 sanity"
  95579:
    title: "Smoke applies to people once per tick"
    changes:
      lelandkemble:
        - bugfix: "Smoke no longer exposes mobs to reagents multiple times per tick, significantly lowering the duration of effects applied by chemical smoke"
  95646:
    title: "Ore vents now turn transparent and clickthrough when there's a mob behind them"
    changes:
      SmArtKar:
        - tweak: "Ore vents now turn transparent and clickthrough when a mob enters the tile above them. The bottom half of the vent is still clickable."
        - code_imp: "Cleaned up ore vent code"
  95697:
    title: "Keen Nose Quirk - The Smell of Discovery"
    changes:
      timothymtorres:
        - rscadd: "Added a new positive quirk \"Keen Nose\". Characters with this quirk can smell chemical contents in open beakers and bottles simply by examining them while held. The smell description is identical to the taste description of the reagents."
        - rscadd: "Getting pepper-sprayed now causes a mob to lose their sense of smell for half a minute."
  95724:
    title: "Logs explosive holoparasite boobytraps being set and exploding"
    changes:
      00-Steven:
        - admin: "Holoparasite boobytraps now log when they're set and when they explode."
  95412:
    title: "Re-Implements the Bounty List for cargo, and various bounty improvements."
    changes:
      ArcaneMusic:
        - rscadd: "The Civilian bounty pad now has a new tab, where players can collaborate and work together to complete additional, station wide bounties. Reward is split based on the amount contributed. (Between 5-10 based on population to start)"
        - rscadd: "The civilian bounty pad can now print out sheets of paper displaying all available bounties, like old times."
        - bugfix: "The ninja holding facility is no longer loaded when civilian bounties are sent."
  95703:
    title: "Remove tramstation inner supermatter APC"
