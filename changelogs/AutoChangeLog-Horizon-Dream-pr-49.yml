  49:
    repo: "horizon-dev-team/Horizon-Dream"
    title: "ADD: Build Mode - Build Panel"
    body: |
      ## Описание изменений
      Добавлен новый режим в Build Mode: Build Panel - панель с браузером всех турфов/мобов/объектов/предметов в билде.
      При выборе предмета создается прозрачный чертеж (призрак) объекта.
      
      Управление работает по аналогии с Adv-Mode:
      - ЛКМ - поставить выбранный объект.
      - ПКМ - очистить выбор.
      - Alt+ЛКМ - скопировать объект в выбор.
      - Alt+ПКМ - удалить объект.
      
      В Build Panel при активной кнопке pixel доступна точечная установка предметов по пикселям.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Это чертовский важное обновление, тк меня уже бесит что если я что-то должен найти то искать в файлах либо в коде.
      Добавляет удобства и что главное упрощает всю дальнейшую разработку в целом.
      
