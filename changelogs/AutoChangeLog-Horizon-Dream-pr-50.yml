    title: "ADD: Master Sound Settings"
    body: |
      ## Описание изменений
      Добавляет вкладку с настройкой всех звуков в игре.
      - Звуки разделены на несколько категорий.
      
      Меняет комбинацию клавиш на перемещение окон, вместо обычного ALT теперь нужно зажать CTRL+ALT. 
      
      ## Причина создания ПР / Почему это хорошо для игры
      Данная задумка была вдохновлена идеей [MonkeStation](https://github.com/Monkestation/Monkestation2.0), но вместо обычных ползунков звуков. Добавить полноценную настройку всех звуков в игре.
      Тонкая настройка звуков в игре крайне важный параметр который не хватает всем билда в принципе, я не знаю почему никто об этом не задумывался никогда.
      
