    title: "ADD: Directional attacks"
    body: |
      ## Описание изменений
      Портирует направленные атаки, с некоторыми фиксами.
      - https://github.com/tgstation/TerraGov-Marine-Corps/pull/15089
      
      Атаки работают в комбат моде на соседнем с тайле.
      Добавлены настройки с выбором из 3 режимов: Всегда / Только по мобам / Выключено.
      
      ## Причина создания ПР / Почему это хорошо для игры
      В будущем скорострельность и скорость пуль будут повышаться, что сделает классический ближний бой менее актуальным.
      Также направленные атаки позволяют крупным мобам (размером более 1 тайла) корректно наносить удары в упор.
      
      ## Демонстрация изменений / Тестирование
      Позже.
