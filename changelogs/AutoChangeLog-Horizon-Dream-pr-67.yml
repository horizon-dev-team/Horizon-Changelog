Horizon =][=:
  67:
    repo: "horizon-dev-team/Horizon-Dream"
    title: "REFACTOR: HTML-Lobby full-redesign CRT-style"
    body: |
      ## Описание изменений
      Кратко:
      - Удалена подсистема SStitle (title.dm, default_title.dmi, previous_icon); из турфа splashscreen вырезана вся привязанная к ней логика.
      - Подсистема больше не используется - лобби рендерится через HTML/TGUI (пакет tgui-lobby, окно в скине).
      - Вычищен контент старого HUD-лобби: PNG-иконки кнопок (icons/hud/lobby/png/), связанные скрипты и ассеты.
      
      Более подробно:
      - Новый HTML-интерфейс лобби
      - Фильтр CRT (скэнлайны, шум, виньетка, тинт) с переключателем в настройках
      - Три цветовые темы на выбор: Синяя, Зелёная и Оранжевая
      - Поддержка видео-фона / гиф / картинок; случайный выбор из config/lobby_art/ при старте сервера - контент подхватывается без ребилда
      - Превью персонажа с циклической прокруткой направлений (rotate) и перезагрузкой (refresh)
      - Панель статистики: сервер, карта, фаза, время, игроки, готовы, админы
      - Более плавные переходы Fade-in / fade-out между лобби и игрой, включая обратный кросс-фейд при возврате в лобби
      - Автомасштабирование интерфейса под маленькие окна браузера (пропорциональное уменьшение ниже 880x640, фон и CRT не трогаются)
      - Настройки лобби (шестерёнка): тема, CRT-фильтр, тинт, фон, видео, звуки
      - UI-звуки нажатий с переключателем
      
      Изменён принцип работы TG-лобби:
      - Жизненный цикл окна: создаётся при входе в лобби, закрывается после fade-out при уходе в игру. (Ранее скрывалось без закрытия)
      - Предпросмотр персонажа (4 направления) с перезагрузкой окошка превью.
      
      ## Причина создания ПР / Почему это хорошо для игры
      HTML-лобби заменяет TG-HTML-Лобби на иной, более простой, вдохновлённый CM13 с CRT-эстетикой.
      Три цветовые темы на выбор.
      Видео-фон и превью персонажа делают лобби более интерактивным и персонализированным.
      Удаление SStitle и старого лобби убирает мёртвый код, снижает количество зависимостей.
      
