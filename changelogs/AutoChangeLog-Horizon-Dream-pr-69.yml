    title: "REFACTOR: Transparent chat & Fullscreen game"
    body: |
      ## Описание изменений
      Очень сильно меняет чат в игре, отделяя его от игры делая полноценным отдельным/прозрачным окном поверх игры.
      Добавляет поддержку фуллскрина, отключаем по умолчанию чат-панель сбоку игры.
      
      Более подробно:
      - Три режима расположения чата - оверлей на карте (по умолчанию), классическая докнутая панель, отдельное окно.
        - Кнопка в шапке (оверлей/окно) и списком игровых настройках (все три режима).
      - Сворачивание в полосу (peek strip) - чат схлопывается в тонкую полосу у закреплённого края и показывает живой хвост лога;
        - Есть возможность настроить перетискиванием границы в чате.
      - Боевая лента (combat strip) - режим, в котором высота полосы автоматически подгоняется под «хвост» свежих сообщений: мгновенный рост и плавное сжатие сообщений.
      - Позиционирование в любом из 4 углов 
        - Верхние части чат реверсирован и рендерят перевёрнутый лог (новейшее у угла).
        - Настройка положения чата двумя осями (Top/Bottom × Left/Right) в один ряд
      - Fade-режим - сообщения появляются и плавно затухают, опциональные подложки и обводка текста для читаемости поверх карты; регулировка прозрачности подложки, размера шрифта и межстрочного интервала.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Убирает стат-панель справа что занимало 1/3 экрана игры, чат и информация заменяя её на полноценный отдельный чат и расширяя игру до полноэкранного режима.
      
