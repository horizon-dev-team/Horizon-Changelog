  71:
    repo: "horizon-dev-team/Horizon-Dream"
    title: "ADD: HUD48 - Переработка интерфейса"
    body: |
      ## Описание изменений
      Полная переработка HUD-интерфейса с поддержкой широких (48×32) слотов.
      - Добавлено несколько новых стилей HUD.
      - Добавлен прогресс-бар КД между действиями.
      - Визуально увеличены некоторые слоты под размеры 48×32.
      - Центрирование предметов любого размера.
      - Перерисованы статусные эффекты
      
      По существу:
      - Выключены стандартные темы интерфейсов
      - Добавлены 3 основные темы (примеры ниже).
        - `Atomic` (Orange)
        - `Belter` (Green)
        - `Expanse` (Blue)
      - Адаптированы `Alien` и `Voidwalker` темы.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Широкие 48×32px HUD-слоты лучше читаются, особенно с двуручными предметами или широкими спрайтами, которые раньше вылезали за рамки 32×32px.
      Также визуально добавлен прогресс-бар КД (отката удара) - он уже был в коде, но ранее не отображался для игрока.
      
