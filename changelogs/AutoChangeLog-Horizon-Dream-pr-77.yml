# PR: horizon-dev-team/Horizon-Dream/77
Horizon =][=:
  77:
    repo: "horizon-dev-team/Horizon-Dream"
    title: "ADD: HorizonShadows / New Render Algorithm Wall / Rework More More More"
    body: |
      ## Описание изменений
      Обновление стоящее пол-года работы и очень длительной подготовки, и то работа закончена лишь на половину из-за объема пересмотра всего билда.
      
      Кратко:
      - Добавляет отбрасываемые тени от стен.
      - Новый Алгоритм РЕНДЕРА стен и ОБЪЕКТОВ.
      - Респрайт многих стен и объектов, под новый стиль.
      
      По содержанию:
      - Изменяет подход к рендеру теней, с кубов на ray-cast (запеченный шейдер, и трюк - экономный рендер на клиенте)
        - Тени строятся цепочкой плейнов `WALLS_FOV_PLANE_*`: фильтры `displace` по запеченным картам
        - Источники теней - отдельные объекты `atom_shadow` у стен и дверей.
        - Тени корректно переезжают и поворачиваются вместе с шаттлом.
      - Меняет алгоритм отрисовки стен на сборный (подготовка ещё со времен #61)
        - Каждый угол стены собирается из четырёх кадров. Новый флаг `SMOOTH_CONNECTOR` даёт свой `smooth_icon()` вместо стандартного битмаска.
        - По тому же алгоритму работают окна (в том числе рамы), решётки и шлюзы. Диагональные углы стен шаттлов получили подложку (пол соседа или космос).
        - Определения стен и минералов вынесены из `code/game/turfs/closed/*` в `_horizon/code/game/aesthetics/` и `modules_wall/`.
      - Пересмотр почти всей графики стен, под новые тени и много правок объектов (не всех, объем слишком велик).
        - 190 новых `.dmi`: стены, двери и шлюзы, окна и smooth-структуры, тени и карты FOV.
      
      Также входит:
      - Плейны переразмечены (`FLOOR_PLANE -9` ... `MOB_PLANE -4`). Мобы, стулья и трубы переведены на новые плейны.
      - Мульти-Z: смещение уровней, настройка multi-z parallax отключена, значения culling сдвинуты. Для проверки добавлена карта `runtimestation`.
      - Подсказки (screentips) и осмотр учитывают видимость через стены. По умолчанию подсказки только контекстные.
      - Прицелы и бинокли сдвигают маску теней вместе с обзором.
      - Меню правой кнопки мыши у игроков отключено по умолчанию, админ-кнопка его включает.
      - Направления настенных объектов (лампы, камеры, таблички, телескрины) подогнаны под новые стены.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Это обновление готовилось очень и очень долго, уже становиться очень тяжело учесть Абсолютно все наработки и код. Для упрощение и дальнейшего продвижения исправление будут делать in-live режиме.
      - То есть в данном обновлении есть и будут недоработки и ошибки которые надеюсь в будущем удастся закрыть.
      
