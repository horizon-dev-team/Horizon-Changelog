  81:
    repo: "horizon-dev-team/Horizon-Dream"
    title: "ADD: Need Water - Thirst / Encumbrance Weight system"
    body: |
      ## Описание изменений
      Добавляет механики:
      - Жажду и Вес и перегруз.
      
      Добавлена жажда для основных рас, которые теперь нуждаются в её утолении.
      - Напитки пополняют жажду, у разных реагентов свои значения утоления жажды.
      - В наборы выживания добавлены питательный батончик и бутылка воды; обновлено самообследование состояния.
        
      Вес и перегруз. Система переноса веса:
      - Теперь у предметов есть масса.
      - У контейнеров - процентное снижение веса (рюкзак -30%, сумка -25%, дафл -15%, пояс -50%, MODsuit −50%, РПЭД/мешки для руды и листов, блюспейс-контейнеры). 
      - 100u реагента = 1 кг, дозы (таблетки, патчи) почти невесомы, материалы весят по штукам. 
      - Персонажи на плече весят вдвое меньше собственной массы. (У человека/гуманоида по умолчанию вес 60кг)
      
      Перегруз: 
      - Максимальный переносимый вес 50кг, который может снижаться от потребностей персонажа.
      - Вплоть до 120% от максимума персонаж падает, 
      - Голод и жажда снижают грузоподъёмность. 
      - Перегруз ускоряет расход еды и воды при ходьбе (до ×2.5).
      
      Изменены HUD
      - Полоски голода и жажды заменены круговыми индикаторами.
      - Добавлен индикатор перегруза и подсказки при наведении.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Еда без воды была неполной механикой выживания: теперь есть жажда.
      
      Вес делает выбор снаряжения более осмысленным и доходить к нему с умом: Теперь быть манчкином неудобно, а контейнеры и броня влияют по-разному.
      
      Голод, жажда и вес связаны: перегруженный и голодный персонаж быстрее выдыхается, поэтому есть смысл брать воду и еду.
      
