# PR: horizon-dev-team/HORIZON-Project-Prototype/99
delete-after: True
/TG/Station:
  95534:
    title: "Fixes 2 instances of turf changing not affecting mounted objects correctly"
    changes:
      SyncIt21:
        - bugfix: "Any effect that changes the theme of the environment no longer break turf mounted objects"
        - bugfix: "destroying plating with lava/water etc will destroy any object mounted to it"
  95546:
    title: "Fixes ethereal revive and species change"
    changes:
      Time-Green:
        - bugfix: "Ethereal crystal revive no longer breaks if you change species midway through"
  95528:
    title: "Blood Worms can drag themselves onto corpses to infest them"
    changes:
      Jacquerel:
        - qol: "Blood worms can drag themselves onto corpses to infest them as an alternative to pressing the action button."
  95522:
    title: "Admins can actually ban from recovered crew, blood worm, fugitive(/hunter), paradox clone, monkey helmet, glitch"
    changes:
      MrMelbert:
        - admin: "Admins can ban from \"recovered crew\", \"blood worm\", \"fugitive\" / \"fugitive hunter\", \"glitch\", and \"paradox clone\""
        - admin: "Mind Magnification Monkeys are now affected by a sentience ban (previously unbannable)"
  95511:
    title: "Mob height is stored in DNA"
    changes:
      MrMelbert:
        - qol: "Height is now an element of DNA, meaning it can be changed via genetics or radstorms and is carried between genetic copies (Changlings, etc)"
  95531:
    title: "Dramatically reduces upgraded exoscanner power draw"
    changes:
      Hatterhat:
        - balance: "Upgraded exoscanners no longer have skyrocketing power draw when upgraded, following an incident where a station's chief engineer declared vendetta upon their Cargo department for drawing an excessive amount of power, resulting in massive casualties."
  95467:
    title: "We made psyker hunters playable but now we need to make psyker hunters playable"
    changes:
      MrMelbert:
        - balance: "The Psyker hunter ship now has a bandolier and two holsters for their shotgun and revolvers, as well as some backup knives."
        - balance: "The Psyker hunter ship now has a box of bandages and an emergency medkit."
        - balance: "All Psyker hunters now spawn with a headset set to a shared frequency."
        - balance: "Psyker headsets now prevent their echolocation from being disabled due to deafness."
        - balance: "Psyker hunters now spawn with flavorful eyewear. The Psyker Seer now spawns with the thermal monocle (which was previously on the ship)."
        - balance: "Gore will now heal Psykers."
  95550:
    title: "Fix stray 0 in heretic UI"
    changes:
      MrMelbert:
        - bugfix: "Fix stray 0 in heretic UI"