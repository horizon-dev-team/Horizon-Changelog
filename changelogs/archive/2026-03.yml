      title: Adds a 0 point quirk that turns your body into a recovered crewmember
        (effectively) on DNRing
    95476:
      changes:
        FalloutFalcon:
        - spellcheck: removed extra space on spraying an atmos machine with spray
            can
      title: Removes a double space on to_chat for spray can
