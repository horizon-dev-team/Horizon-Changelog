    title: "ADD: Movable Physics - Bullet Casing Expansion"
    body: |
      ## Описание изменений
      Внедрена новая подсистема физики подвижных объектов (`movable_physics`), одно из первых упоминаний этой физики можно найти на **[Mojave Sun](https://github.com/Mojave-Sun/mojave-sun-13/pull/2231)**, конкретно тут за основу взята система с `Monkey Station`.
      - Изменена логика выброса гильз. Гильзы вылетают из оружия с учетом физики: имеют начальную скорость, инерцию, отскакивают от препятствий и вращаются в полете.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Стандартное появление гильз на полу выглядело очень плоско - добавление анимации вылета гильз добавляет больше визуальной информации. 
      Также компонент физики открывает потенциал для будущих фишек и других подвижных объектов.
      
      ## Демонстрация изменений / Тестирование
