    body: |
      ## Описание изменений
      Портирование эффектов стрельбы и попаданий пуль из огнестрела, и эффект взрывной волны с TGMC.
      - https://github.com/tgstation/TerraGov-Marine-Corps/pull/9655
      - https://github.com/tgstation/TerraGov-Marine-Corps/pull/12752
      - https://github.com/tgstation/TerraGov-Marine-Corps/pull/13963
      
      ## Причина создания ПР / Почему это хорошо для игры
      Баллистическое оружие теперь издает дым при стрельбе, а пули испускают частицы при попадании в объекты и стены.
      При попадании по живому карбону, из того испускается эффект попадания пули кровь.
      При сильных взрывах создается взрывная волна.
      
