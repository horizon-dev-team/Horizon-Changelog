    title: "ADD: Reworked Debug Outfit & Tools"
    body: |
      ## Описание изменений
      Переработан дебаг-аутфит (переименован в "Nullspace Tech") для удобного тестирования.
      Добавлены новые спрайты для дебаг-мода и предметов, и переработаны некоторые другие.
      
      Переработаны дебаг-худы:
      - Механика просмотра темноты заменена на ПНВ (вместо среза темноты).
      - Позволяет вкл/выкл ПНВ
      - Позволяет вкл/выкл вид HUD
      
      Добавлены новые инструменты:
      - Дебаг блюспейс-пояс (увеличенная вместимость, содержит улучшенные инструменты).
      - Тактический кислородный баллон (баллон + слот под оружие).
      - Тактический зарядник (переносной зарядник на спину).
      - Медицинская груша (проведение СЛР без необходимости дышать самому).
      - Улучшенный мед-анализатор сканирует на расстояние 3 клеток.
      
      Изменено наполнение дебаг-аутфита.
      
      ## Причина создания ПР / Почему это хорошо для игры
      Обновляет и расширяет инструменты для разработки и тестирования, делая процесс проверки механик быстрее и удобнее.
      
